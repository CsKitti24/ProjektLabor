name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend dependencies
        run: dotnet restore ProjektLabor.sln

      - name: Build backend
        run: dotnet build ProjektLabor.sln --no-restore --configuration Release

      - name: Run backend tests
        run: dotnet test ProjektLabor.sln --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~SqlServerIntegrationTests"

  sqlserver-integration:
    name: SQL Server Integration Tests
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: 'ProjektLabor_CI_SQL_123!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ProjektLabor_CI_SQL_123!' -C -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build backend
        run: dotnet build ProjektLabor.sln --configuration Release

      - name: Run SQL Server integration tests
        env:
          SQLSERVER_TEST_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=ProjektLabor_CI_SQL_123!;TrustServerCertificate=True;Encrypt=False
        run: dotnet test backend.Tests/backend.Tests.csproj --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName~SqlServerIntegrationTests"

  frontend:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config

      - name: Verify Docker build
        run: docker compose --env-file .env.example build
