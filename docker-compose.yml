services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Csak a saját gépről érhető el (a böngésző a frontend nginx proxyján át, a 3000-es porton éri el
    # az API-t); a hálózat felé nincs nyitott backend-port.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - Authentication__Jwt__Issuer=${JWT_ISSUER:?Set JWT_ISSUER in .env}
      - Authentication__Jwt__Audience=${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      - Authentication__Jwt__SigningKey=${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      - BootstrapAdmin__Username=${BOOTSTRAP_ADMIN_USERNAME:?Set BOOTSTRAP_ADMIN_USERNAME in .env}
      - BootstrapAdmin__Password=${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      # A mintafiókok (admin/oktato/portas/igazgato/radli.richard) jelszava nyilvános; csak bemutatóhoz kapcsold be.
      - SampleAccounts__Enabled=${SAMPLE_ACCOUNTS_ENABLED:-false}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      - ConnectionStrings__DefaultConnection=Server=mssql;Database=KeyAndRoomDb;User Id=sa;TrustServerCertificate=True;
      - Database__Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      - APPLY_MIGRATIONS=true
      - ASPNETCORE_URLS=http://+:8000
    networks:
      - app-network
    depends_on:
      mssql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mssql:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Csak a saját gépről érhető el (pl. DBeaver, Azure Data Studio); a hálózat felé nem.
    ports:
      - "127.0.0.1:1433:1433"
    environment:
      - ACCEPT_EULA=${ACCEPT_EULA:-Y}
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    networks:
      - app-network
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

networks:
  app-network:
    driver: bridge

volumes:
  mssql-data:
