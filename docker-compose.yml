services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Csak a saját gépről érhető el (a böngésző a frontend nginx proxyján át, a 3000-es porton éri el
    # az API-t); a hálózat felé nincs nyitott backend-port.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - Authentication__Jwt__Issuer=${JWT_ISSUER:?Set JWT_ISSUER in .env}
      - Authentication__Jwt__Audience=${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      - Authentication__Jwt__SigningKey=${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      - BootstrapAdmin__Username=${BOOTSTRAP_ADMIN_USERNAME:?Set BOOTSTRAP_ADMIN_USERNAME in .env}
      - BootstrapAdmin__Password=${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      # A mintafiókok (admin/oktato/portas/igazgato/radli.richard) jelszava nyilvános; csak bemutatóhoz kapcsold be.
      - SampleAccounts__Enabled=${SAMPLE_ACCOUNTS_ENABLED:-false}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      # HTTPS-t lezáró proxy mögött true: a bejelentkezési süti csak titkosított kapcsolaton utazik.
      - Authentication__Cookie__SecureOnly=${AUTH_COOKIE_SECURE:-false}
      # Az alkalmazás nem "sa"-ként, hanem a db-init által létrehozott, csak ehhez az adatbázishoz
      # jogosult felhasználóval csatlakozik.
      - ConnectionStrings__DefaultConnection=Server=mssql;Database=KeyAndRoomDb;User Id=projektlabor_app;TrustServerCertificate=True;
      - Database__Password=${MSSQL_APP_PASSWORD:?Set MSSQL_APP_PASSWORD in .env}
      - APPLY_MIGRATIONS=true
      - ASPNETCORE_URLS=http://+:8000
    networks:
      - app-network
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Egyszeri előkészítés: létrehozza az adatbázist és az alkalmazás saját (nem rendszergazda) felhasználóját.
  db-init:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    entrypoint: ["/bin/bash", "/init/init-app-user.sh"]
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      - MSSQL_APP_PASSWORD=${MSSQL_APP_PASSWORD:?Set MSSQL_APP_PASSWORD in .env}
    volumes:
      - ./database/init-app-user.sh:/init/init-app-user.sh:ro
    networks:
      - app-network
    depends_on:
      mssql:
        condition: service_healthy
    restart: "no"

  mssql:
    platform: linux/amd64
    # Rögzített image-verzió (SQL Server 2022, 16.0.4305.5): a "latest" címke magától nem frissül
    # egy új, nem tesztelt kiadásra. Frissítéskor az új digestet tesztelés után írd be ide és a db-init-hez.
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    # Csak a saját gépről érhető el (pl. DBeaver, Azure Data Studio); a hálózat felé nem.
    ports:
      - "127.0.0.1:1433:1433"
    environment:
      - ACCEPT_EULA=${ACCEPT_EULA:-Y}
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    networks:
      - app-network
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

networks:
  app-network:
    driver: bridge

volumes:
  mssql-data:
